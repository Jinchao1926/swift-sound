# By default, SwiftLint uses a set of sensible default rules you can adjust:
disabled_rules: # rule identifiers turned on by default to exclude from running
  - identifier_name
  # Temporary Disabled Rules
  - type_name
  # These rules need discussed
  - shorthand_operator
  - function_parameter_count
  - nesting

opt_in_rules: # some rules are turned off by default, so you need to opt-in
  - empty_count # Find all the available rules by running: `swiftlint rules`
  - force_unwrapping
  - missing_docs

# Alternatively, specify all rules explicitly by uncommenting this option:
# only_rules: # delete `disabled_rules` & `opt_in_rules` if using this
#   - empty_parameters
#   - vertical_whitespace

included: # paths to include during linting. `--path` is ignored if present.
  - SwiftSound/SwiftSound
  - SwiftSound/SwiftSoundTests
  - SwiftSound/SwiftSoundUITests
# excluded: # paths to ignore during linting. Takes precedence over `included`.

file_length: 450

line_length:
  warning: 120
  error: 300
  ignores_comments: true

custom_rules:
  debug_print_rule:
    name: "Console Pollution"
    regex: "print\\(.*\\)"
    message: "Use debugPrint instead of print. Using print will write to console even in Release configuration."
  
